<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Kroatisch lernen in 150 Tagen: Alltagssätze, Grammatik, Hören und Sprechen.">
<meta name="theme-color" content="#1B3A9E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pomalo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Pomalo Kroatisch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: one calm reading column (max 760px); lessons take over the screen with a sticky check bar at the bottom.
   Colours: Croatian red, white and blue. Blue = actions and progress, red = accents and the šahovnica checkerboard. */
:root{
  --bg:#F4F5FA; --surface:#FFFFFF; --surface-2:#ECEFF8; --ink:#0E1838; --muted:#566080; --line:#D8DDEB;
  --sea:#1B3A9E; --sea-ink:#FFFFFF; --sea-soft:#E2E8F8;
  --red:#D0102B; --red-soft:#FBE4E7; --blue:#1B3A9E; --on:#FFFFFF; --on-2:rgba(255,255,255,.78);
  --good:#1D7A47; --good-soft:#E0F2E7; --bad:#B42A1E; --bad-soft:#FAE6E2; --sun:#A8700F; --sun-soft:#F7EDD8;
  --f-hr:"Literata", Georgia, "Times New Roman", serif;
  --f-ui:"Schibsted Grotesk", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A112C; --surface:#111A3D; --surface-2:#17214A; --ink:#E8ECF8; --muted:#9AA4C6; --line:#263259;
    --sea:#7E9CFF; --sea-ink:#0A112C; --sea-soft:#1C2A5C;
    --red:#FF5A6E; --red-soft:#3A1522; --blue:#1F3A9A; --on:#FFFFFF; --on-2:rgba(255,255,255,.78);
    --good:#6FD197; --good-soft:#123425; --bad:#FF8A78; --bad-soft:#3D1A17; --sun:#E8B65A; --sun-soft:#3A2C12;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A112C; --surface:#111A3D; --surface-2:#17214A; --ink:#E8ECF8; --muted:#9AA4C6; --line:#263259;
  --sea:#7E9CFF; --sea-ink:#0A112C; --sea-soft:#1C2A5C;
  --red:#FF5A6E; --red-soft:#3A1522; --blue:#1F3A9A; --on:#FFFFFF; --on-2:rgba(255,255,255,.78);
  --good:#6FD197; --good-soft:#123425; --bad:#FF8A78; --bad-soft:#3D1A17; --sun:#E8B65A; --sun-soft:#3A2C12;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-ui);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hr{font-family:var(--f-hr)}
h1,h2,h3{text-wrap:balance;margin:0}

/* header */
/* Header: solid blue bar, white type, red line underneath */
body::before{background:var(--blue)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--blue);color:var(--on);border-bottom:4px solid var(--red)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:baseline;gap:9px;background:none;border:0;padding:0;color:var(--on)}
.brand b{font:italic 600 1.5rem/1 var(--f-hr);letter-spacing:-.01em}
.brand span{font-size:.76rem;color:var(--on-2);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{background:none;border:0;padding:7px 11px;border-radius:8px;color:var(--on-2);font-weight:500;font-size:.93rem;display:inline-flex;gap:6px;align-items:center}
nav button:hover{color:var(--on);background:rgba(255,255,255,.12)}
nav button[aria-current="page"]{color:var(--blue);background:var(--on);font-weight:600}
.top button:focus-visible{outline-color:var(--on)}
.badge{font-size:.72rem;font-weight:700;min-width:20px;padding:1px 6px;border-radius:99px;background:var(--red);color:#fff;font-variant-numeric:tabular-nums}

main{padding-block:28px 64px}
.eyebrow{font-size:.76rem;letter-spacing:.09em;text-transform:uppercase;color:var(--red);font-weight:700;margin:0 0 10px}
.lead{color:var(--muted);max-width:60ch;margin:12px 0 0}
h1{font:600 clamp(1.8rem,5vw,2.5rem)/1.12 var(--f-hr);letter-spacing:-.015em}
h2{font:600 clamp(1.4rem,4vw,1.85rem)/1.15 var(--f-hr);letter-spacing:-.01em}
h3{font:600 1.15rem/1.3 var(--f-hr)}

/* today */
/* Today card: blue surface, white type, red start button */
.today{background:var(--blue);color:var(--on);border-radius:16px;padding:22px 22px 22px;margin-top:22px;border-left:6px solid var(--red)}
.today .eyebrow{color:var(--on-2)}
.stat.streak .n{color:var(--red)}
.today .meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--on-2);font-size:.88rem;margin:10px 0 16px}
.today .plan{list-style:none;padding:0;margin:0 0 20px;display:grid;gap:6px}
.today .plan li{display:flex;gap:10px;align-items:baseline;font-size:.95rem}
.today .plan li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red);flex:none;transform:translateY(-2px)}
.today .btn{background:var(--on);border-color:var(--on);color:var(--blue)}
.today .btn.primary{background:#D0102B;border-color:#D0102B;color:var(--on)}
.today .lead{color:var(--on-2)}
.donebox{background:rgba(255,255,255,.14);color:var(--on);border-radius:10px;padding:10px 14px;margin:0 0 16px;font-size:.93rem}
.donebox b{color:var(--on)}
/* Done screen header */
.hero{background:var(--blue);color:var(--on);border-radius:16px;padding:24px 22px 20px;border-left:6px solid var(--red);margin-bottom:24px}
.hero .eyebrow{color:var(--on-2)}
.hero .score{margin:18px 0 0}
.hero .score .l{color:var(--on-2)}
.banner{background:var(--sun-soft);border-radius:12px;padding:12px 16px;margin-top:18px;font-size:.92rem}
.banner b{color:var(--sun)}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 8px}
.stat{flex:1 1 150px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat .n{font:600 1.5rem/1.1 var(--f-ui);font-variant-numeric:tabular-nums}
.stat .l{font-size:.82rem;color:var(--muted)}
.stat.due{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.lvlbar{margin-top:26px}
.lvlbar .row{justify-content:space-between}
.track{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:8px}
.track span{display:block;height:100%;background:var(--sea);border-radius:4px}

/* course */
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:34px 0 10px;gap:12px;flex-wrap:wrap}
.sec-h p{margin:0;color:var(--muted);font-size:.85rem}
.level{margin-top:30px}
.level h2{font-size:1.25rem}
.level .sub{color:var(--muted);font-size:.88rem;margin:4px 0 10px}
.chs{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.ch{display:grid;grid-template-columns:40px 1fr auto;gap:6px 14px;align-items:center;border-bottom:1px solid var(--line);padding:12px 4px}
.ch .num{font:400 1.5rem/1 var(--f-hr);color:var(--muted);font-variant-numeric:tabular-nums}
.ch .ct{min-width:0;background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column}
.ch .ct strong{font-weight:600;font-size:1.02rem}
.ch .ct span{color:var(--muted);font-size:.88rem}
.ch .ct:hover strong{color:var(--sea)}
.ch.locked .ct strong,.ch.locked .num{color:var(--muted)}
.pills{display:flex;gap:5px}
.pill{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font:600 .78rem var(--f-ui);color:var(--muted);padding:0;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.pill.fin{background:var(--sea);border-color:var(--sea);color:var(--sea-ink)}
.pill.cur{border:2px solid var(--red);color:var(--red);background:var(--red-soft)}
.pill:disabled{opacity:.45;cursor:not-allowed}
.pill:not(:disabled):hover{border-color:var(--sea)}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 18px;border-radius:10px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--sea);border-color:var(--sea);color:var(--sea-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.small{padding:6px 12px;font-size:.88rem}
.btn.big{padding:13px 24px;font-size:1.05rem}
.btn.ghost{background:none}
.link{background:none;border:0;padding:0;color:var(--sea);font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* chapter page */
.back{background:none;border:0;padding:4px 0;color:var(--muted);font-weight:500;margin-bottom:14px}
.back:hover{color:var(--ink)}
.days{list-style:none;margin:20px 0 0;padding:0;border-top:1px solid var(--line)}
.days li{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.days .dt{display:flex;flex-direction:column;min-width:0}
.days .dt b{font-weight:600}
.days .dt span{color:var(--muted);font-size:.88rem}
.gram{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin:28px 0}
.gram .eyebrow{margin-bottom:6px}
.gram p{margin:10px 0;max-width:62ch}
.gram ul{padding-left:20px;margin:8px 0}
.gram li{margin:4px 0}
.gram em{font-family:var(--f-hr);font-style:italic;color:var(--sea)}
.tbl{overflow-x:auto;margin:12px 0}
.tbl table{border-collapse:collapse;min-width:100%;font-size:.95rem}
.tbl th{font-weight:600;text-align:left;color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;padding:6px 12px 6px 0;border-bottom:1px solid var(--line)}
.tbl td{padding:7px 12px 7px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.hr{font-size:1.02rem}
.tbl b{color:var(--sea);font-weight:600}
.tip{background:var(--sea-soft);border-radius:10px;padding:10px 14px;font-size:.93rem;margin-top:12px}

.plist{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.plist li{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.plist .t{min-width:0}
.plist .h{font:400 1.1rem/1.4 var(--f-hr)}
.plist .d{color:var(--muted);font-size:.93rem}
.plist .note{font-size:.84rem;color:var(--muted);margin-top:4px;padding-left:10px;border-left:2px solid var(--line)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:0 20px;margin-top:6px}
.vgrid div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);min-width:0}
.vgrid .h{font-family:var(--f-hr);display:flex;align-items:center;gap:8px}
.vgrid .d{color:var(--muted);font-size:.9rem;text-align:right}
.g{font-size:.7rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:2px;font-family:var(--f-ui)}

.say{width:34px;height:34px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;color:var(--sea);padding:0}
.say:hover{border-color:var(--sea)}
.say.sm{width:28px;height:28px}
.say.sm svg{width:15px;height:15px}

.search{width:100%;font:inherit;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);margin:18px 0 8px}
.pb-unit{margin-top:30px}
.pb-unit h3{margin-bottom:8px}
.empty{color:var(--muted);padding:30px 0}
.practice{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:22px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.pcard p{margin:0;color:var(--muted);font-size:.9rem;flex:1}

/* lesson */
.lesson{max-width:680px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.l-top{display:flex;align-items:center;gap:14px;padding-block:16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:3}
.x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.2rem;line-height:1;padding:0;color:var(--muted)}
.bar{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:var(--red);border-radius:4px;transition:width .3s ease}
.count{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.ex{flex:1;padding-block:14px 28px}
.kicker{font-size:.8rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 12px}
.kicker .dir{color:var(--sea);margin-left:6px;letter-spacing:.04em}
.prompt{font-size:1.3rem;line-height:1.4;font-weight:500;margin:0 0 22px;display:flex;gap:12px;align-items:center}
.prompt.hr{font:400 1.6rem/1.35 var(--f-hr)}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-bottom-width:2px;border-radius:12px;padding:13px 14px;font-size:1.02rem}
.opt.hr span{font:400 1.12rem/1.4 var(--f-hr)}
.opt:hover:not(:disabled){border-color:var(--muted)}
.opt kbd{font:600 .72rem var(--f-ui);color:var(--muted);border:1px solid var(--line);border-radius:5px;min-width:22px;height:22px;display:inline-grid;place-items:center;flex:none}
.opt.sel{border-color:var(--sea);background:var(--sea-soft)}
.opt.good{border-color:var(--good);background:var(--good-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.gone{opacity:.35}
.opt:disabled{cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chips .opt{width:auto;font:400 1.12rem var(--f-hr)}
.gap{font-size:1.55rem;line-height:1.6;margin:4px 0 6px}
.slot{display:inline-block;min-width:90px;border-bottom:2px solid var(--sea);text-align:center;padding:0 6px;color:var(--sea)}
.slot.good{color:var(--good);border-color:var(--good)}
.slot.bad{color:var(--bad);border-color:var(--bad)}
.sub{color:var(--muted);margin:0 0 22px}
.ctx{font-size:1.02rem;margin:0 0 16px;max-width:58ch}
.bubble{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:14px 16px;margin:0 0 22px;max-width:540px}
.bubble p{margin:0;font-size:1.25rem;line-height:1.4}
.listen{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:22px}
.play{display:inline-flex;align-items:center;gap:8px;border-radius:99px;border:1px solid var(--sea);background:var(--sea);color:var(--sea-ink);padding:10px 18px;font-weight:600}
.play.slow{background:none;color:var(--sea)}
.play.big{padding:16px 26px;font-size:1.05rem}
.ltext{flex-basis:100%;font:400 1.5rem/1.4 var(--f-hr);margin:6px 0 0}
.answer{min-height:64px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:8px 0 10px;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0 51px,var(--line) 51px 52px);margin-bottom:18px}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.tile{font:400 1.12rem/1 var(--f-hr);background:var(--surface);border:1px solid var(--line);border-bottom-width:2px;border-radius:10px;padding:10px 13px}
.tile.de{font-family:var(--f-ui);font-size:1.02rem}
.tile:hover:not(:disabled){border-color:var(--muted)}
.tile.used{visibility:hidden}
.typed{width:100%;font:400 1.3rem var(--f-hr);padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.dia{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.dia button{font:500 1.05rem var(--f-hr);width:42px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:grid;gap:10px;justify-items:start}
.card .big{font:400 clamp(1.7rem,6vw,2.3rem)/1.25 var(--f-hr);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.card .de{font-size:1.12rem;color:var(--ink)}
.card .lese{font-size:.9rem;color:var(--muted)}
.card .lese i{font-style:normal;color:var(--ink);letter-spacing:.01em}
.card .note{font-size:.88rem;color:var(--muted);padding-left:10px;border-left:2px solid var(--line)}
.info p{margin:0 0 12px;max-width:60ch}
.info .letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:14px 0}
.info .letters div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.info .letters b{font:600 1.4rem/1 var(--f-hr);color:var(--sea);min-width:24px}
.info .letters span{font-size:.88rem;color:var(--muted)}

.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcol{display:grid;gap:10px;align-content:start}
.mcol .opt{min-height:56px}

.mic{display:inline-flex;align-items:center;gap:10px;border-radius:99px;border:2px solid var(--sea);background:var(--surface);color:var(--sea);padding:12px 22px;font-weight:700;font-size:1.02rem}
.mic.on{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.mic .dot{width:10px;height:10px;border-radius:50%;background:currentColor}
.mic.on .dot{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.micout{margin-top:14px;font-size:.95rem;min-height:1.5em}
.micout .heard{font-family:var(--f-hr);font-size:1.1rem}
.micout.good{color:var(--good)} .micout.bad{color:var(--bad)}
.steps{display:grid;gap:4px;margin:16px 0 0;padding-left:20px;color:var(--muted);font-size:.93rem}

.check{position:sticky;bottom:0;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:14px max(16px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg);display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.check.ok{background:var(--good-soft);border-color:var(--good)}
.check.no{background:var(--bad-soft);border-color:var(--bad)}
.fb{flex:1 1 300px;min-width:0}
.fb h4{margin:0 0 4px;font-size:1.05rem}
.check.ok h4{color:var(--good)} .check.no h4{color:var(--bad)}
.fb .ans{display:flex;gap:10px;align-items:center}
.fb .ans .hr{font-size:1.15rem}
.fb .de{color:var(--muted);font-size:.93rem}
.fb .why{font-size:.92rem;margin-top:6px}
.check .btn{min-width:140px;padding-block:12px}
.hint{font-size:.85rem;color:var(--muted)}

.done{padding-block:40px}
.score{display:flex;gap:24px;flex-wrap:wrap;margin:22px 0 30px}
.score div{min-width:0}
.score .n{font:600 2.2rem/1 var(--f-hr);font-variant-numeric:tabular-nums}
.score .l{color:var(--muted);font-size:.85rem}
.next{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:0 0 20px;max-width:520px}
.next small{color:var(--muted);display:block}

.foot{margin-top:48px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:.86rem;display:grid;gap:10px}
.foot .row{gap:8px 16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:5px 10px;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sea-soft);color:var(--ink);font-weight:600}
.danger{color:var(--bad)}

@media (max-width:560px){
  .ch{grid-template-columns:30px 1fr;padding:12px 2px}
  .ch .pills{grid-column:2}
  .prompt.hr{font-size:1.4rem}
  .gap{font-size:1.35rem}
  .match{gap:8px} .mcol{gap:8px}
  .mcol .opt{padding:10px;font-size:.95rem}
  .today{padding:18px 16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<body>
<div id="app"></div>
<script>
const CH = [];
/* Kapitel 1–8 · v:[kroatisch, deutsch, geschlecht?]  p:[kroatisch, deutsch, hinweis?] */
CH.push({
  t:'Hallo!', s:'Grüssen und danken',
  v:[['bok','hallo / tschüss (locker)'],['dobar dan','guten Tag'],['hvala','danke'],['molim','bitte'],['da','ja'],
     ['ne','nein'],['dobro jutro','guten Morgen'],['dobra večer','guten Abend'],['laku noć','gute Nacht'],['doviđenja','auf Wiedersehen']],
  p:[['Hvala lijepa!','Vielen Dank!','Wörtlich: «Schönen Dank!»'],['Nema na čemu.','Gern geschehen.','Kürzer geht auch: «Molim.»'],
     ['Dobro, hvala.','Gut, danke.'],['Vidimo se!','Bis bald!','Wörtlich: «Wir sehen uns!»'],
     ['Bok, kako si?','Hallo, wie geht’s dir?','Locker, unter Freunden. Zu Fremden sagst du «Kako ste?».'],['Dobar dan, kako ste?','Guten Tag, wie geht es Ihnen?','Höflich, mit «Sie».']],
  g:{t:'Aussprache und dreimal «gut»', h:`
    <p>Kroatisch spricht man fast genau so, wie man es schreibt. Jeder Buchstabe hat einen festen Laut. Lern diese zuerst:</p>
    <div class="tbl"><table><thead><tr><th>Buchstabe</th><th>Aussprache</th><th>Beispiel</th></tr></thead><tbody>
    <tr><td class="hr"><b>c</b></td><td>wie z in «Zeit»</td><td class="hr">cijena (Preis)</td></tr>
    <tr><td class="hr"><b>č</b></td><td>hartes tsch wie in «Tschüss»</td><td class="hr">večer (Abend)</td></tr>
    <tr><td class="hr"><b>ć</b></td><td>weiches tsch, fast «tj»</td><td class="hr">noć (Nacht)</td></tr>
    <tr><td class="hr"><b>đ / dž</b></td><td>weiches / hartes dsch</td><td class="hr">doviđenja</td></tr>
    <tr><td class="hr"><b>š</b></td><td>sch</td><td class="hr">šećer (Zucker)</td></tr>
    <tr><td class="hr"><b>ž</b></td><td>weiches sch wie das j in «Journal»</td><td class="hr">plaža (Strand)</td></tr>
    <tr><td class="hr"><b>z</b></td><td>weiches s wie in «Sonne»</td><td class="hr">zub (Zahn)</td></tr>
    <tr><td class="hr"><b>s</b></td><td>immer scharfes s wie in «Bus»</td><td class="hr">sok (Saft)</td></tr>
    <tr><td class="hr"><b>h</b></td><td>wie ch in «Bach»</td><td class="hr">hvala</td></tr>
    <tr><td class="hr"><b>v</b></td><td>wie w</td><td class="hr">večer</td></tr>
    <tr><td class="hr"><b>j</b></td><td>wie j in «ja»</td><td class="hr">jutro</td></tr>
    </tbody></table></div>
    <p>Und schon in den Grüssen steckt die erste Regel: Das Wort für «gut» passt sich dem Wort danach an.</p>
    <ul><li><em>dobar dan</em> – dan ist männlich</li><li><em>dobra večer</em> – večer ist weiblich</li><li><em>dobro jutro</em> – jutro ist sächlich</li></ul>
    <div class="tip">Die Betonung liegt fast nie auf der letzten Silbe. Im Zweifel betonst du die erste: <em>HVA-la</em>, <em>DO-bar</em>.</div>`},
  x:[{de:'Guten Tag!', s:'Dobar ___!', o:['dan','noć','jutro'], why:'dan = Tag, noć = Nacht, jutro = Morgen.'},
     {de:'Guten Morgen!', s:'___ jutro!', o:['Dobro','Dobar','Dobra'], why:'jutro ist sächlich → dobro.'},
     {de:'Guten Abend!', s:'___ večer!', o:['Dobra','Dobar','Dobro'], why:'večer ist weiblich → dobra.'},
     {de:'Vielen Dank!', s:'Hvala ___!', o:['lijepa','molim','dobro'], why:'Hvala lijepa = schönen Dank.'},
     {de:'Wie geht es Ihnen?', s:'Kako ___?', o:['ste','si','se'], why:'ste = Sie (höflich), si = du.'}],
  d:[{ctx:'Du betrittst morgens eine Bäckerei.', line:'Dobro jutro!', lineDe:'Guten Morgen!', o:['Dobro jutro!','Laku noć!','Doviđenja!'], why:'Einen Gruss erwidert man mit demselben Gruss.'},
     {ctx:'Du hältst jemandem die Tür auf.', line:'Hvala lijepa!', lineDe:'Vielen Dank!', o:['Nema na čemu.','Dobar dan.','Ne.'], why:'Nema na čemu = gern geschehen.'},
     {ctx:'Abends verabschiedest du dich vom Kellner.', line:null, o:['Hvala, doviđenja!','Dobro jutro!','Molim, dobar dan!']},
     {ctx:'Eine Bekannte ruft dir zu:', line:'Bok, kako si?', understand:true, o:['Hallo, wie geht’s?','Hallo, wer bist du?','Tschüss, bis morgen!']}]
});

CH.push({
  t:'Ich bin …', s:'Sich vorstellen',
  v:[['ja','ich'],['ti','du'],['on','er'],['ona','sie (eine Frau)'],['mi','wir'],
     ['Vi','Sie (höflich)'],['ime','Name','n'],['Švicarska','die Schweiz','f'],['Njemačka','Deutschland','f'],['Austrija','Österreich','f']],
  p:[['Ja sam Lena.','Ich bin Lena.'],['Zovem se Marko.','Ich heisse Marko.','Wörtlich: «Ich rufe mich Marko.»'],['Drago mi je.','Freut mich.','Wörtlich: «Es ist mir lieb.»'],
     ['Kako se zovete?','Wie heissen Sie?','Per du: «Kako se zoveš?»'],['Odakle ste?','Woher kommen Sie?'],['Ja sam iz Švicarske.','Ich bin aus der Schweiz.','iz + Genitiv: Švicarska → iz Švicarske, Njemačka → iz Njemačke, Austrija → iz Austrije.'],
     ['Mi smo iz Njemačke.','Wir sind aus Deutschland.'],['On je iz Austrije.','Er ist aus Österreich.']],
  g:{t:'biti – sein', h:`
    <p>Das wichtigste Verb. Im Alltag hörst du fast nur die <strong>Kurzformen</strong>. Sie stehen nie am Satzanfang, sondern an der zweiten Stelle im Satz.</p>
    <div class="tbl"><table><thead><tr><th></th><th>Kurzform</th><th>verneint</th></tr></thead><tbody>
    <tr><td>ja (ich)</td><td class="hr"><b>sam</b></td><td class="hr">nisam</td></tr>
    <tr><td>ti (du)</td><td class="hr"><b>si</b></td><td class="hr">nisi</td></tr>
    <tr><td>on / ona (er / sie)</td><td class="hr"><b>je</b></td><td class="hr">nije</td></tr>
    <tr><td>mi (wir)</td><td class="hr"><b>smo</b></td><td class="hr">nismo</td></tr>
    <tr><td>vi / Vi (ihr / Sie)</td><td class="hr"><b>ste</b></td><td class="hr">niste</td></tr>
    <tr><td>oni (sie, Mehrzahl)</td><td class="hr"><b>su</b></td><td class="hr">nisu</td></tr>
    </tbody></table></div>
    <ul><li><em>Ja sam iz Švicarske.</em> oder kürzer <em>Iz Švicarske sam.</em> – beides ist richtig.</li>
    <li>Das «ich» lässt man oft weg, denn <em>sam</em> zeigt schon, wer gemeint ist.</li>
    <li>Fragen am Satzanfang brauchen die Langform: <em>Jeste li iz Zagreba?</em> (Sind Sie aus Zagreb?)</li></ul>`},
  x:[{de:'Ich bin aus der Schweiz.', s:'Ja ___ iz Švicarske.', o:['sam','si','je'], why:'ja → sam (ich bin).'},
     {de:'Wir sind aus Deutschland.', s:'Mi ___ iz Njemačke.', o:['smo','ste','su'], why:'mi → smo.'},
     {de:'Sie ist aus Österreich.', s:'Ona ___ iz Austrije.', o:['je','sam','smo'], why:'on / ona → je.'},
     {de:'Sind Sie aus Zagreb?', s:'___ li iz Zagreba?', o:['Jeste','Ste','Smo'], why:'Am Satzanfang steht die Langform: «Jeste li…?».'},
     {de:'Ich bin nicht aus Deutschland.', s:'Ja ___ iz Njemačke.', o:['nisam','nije','nisi'], why:'Verneint: nisam, nisi, nije, nismo, niste, nisu.'}],
  d:[{ctx:'Eine Frau gibt dir die Hand.', line:'Ja sam Ivana.', lineDe:'Ich bin Ivana.', o:['Drago mi je. Ja sam Lena.','Laku noć, Ivana.','Ne, hvala.'], why:'Drago mi je = Freut mich.'},
     {ctx:'Der Vermieter fragt dich:', line:'Odakle ste?', lineDe:'Woher kommen Sie?', o:['Iz Švicarske.','Švicarska sam.','Švicarske ste.'], why:'Woher? iz + Genitiv: iz Švicarske.'},
     {ctx:'An der Rezeption:', line:'Kako se zovete?', lineDe:'Wie heissen Sie?', o:['Zovem se Meier.','Zovete se Meier.','Ja je Meier.']},
     {ctx:'Dein Nachbar am Strand stellt sich vor:', line:'Ja sam Marko, iz Zagreba.', understand:true, o:['Ich bin Marko, aus Zagreb.','Ich bin Marko und fahre nach Zagreb.','Marko wohnt in Zagreb.']}]
});

CH.push({
  t:'Wie geht’s?', s:'Befinden und Nachfragen',
  v:[['dobro','gut'],['loše','schlecht'],['umoran','müde (Mann)'],['umorna','müde (Frau)'],['gladan','hungrig (Mann)'],
     ['gladna','hungrig (Frau)'],['malo','ein bisschen'],['jako','sehr'],['i','und'],['ali','aber']],
  p:[['Kako ste?','Wie geht es Ihnen?'],['Dobro sam, hvala. A Vi?','Mir geht es gut, danke. Und Ihnen?'],['Ne baš dobro.','Nicht so gut.'],
     ['Umoran sam.','Ich bin müde.','So sagt es ein Mann. Eine Frau sagt: «Umorna sam.»'],['Jako sam gladna.','Ich habe grossen Hunger.','So sagt es eine Frau. Ein Mann sagt: «Jako sam gladan.»'],['Ne razumijem.','Ich verstehe nicht.'],
     ['Možete li ponoviti?','Können Sie das wiederholen?'],['Polako, molim.','Langsam, bitte.']],
  g:{t:'Mann oder Frau: Wörter passen sich an', h:`
    <p>Wenn du etwas über dich sagst, passt sich das Wort deinem Geschlecht an. Frauen hängen meist ein <strong>-a</strong> an.</p>
    <div class="tbl"><table><thead><tr><th></th><th>Mann sagt</th><th>Frau sagt</th></tr></thead><tbody>
    <tr><td>Ich bin müde.</td><td class="hr">Umoran sam.</td><td class="hr">Umorn<b>a</b> sam.</td></tr>
    <tr><td>Ich bin hungrig.</td><td class="hr">Gladan sam.</td><td class="hr">Gladn<b>a</b> sam.</td></tr>
    <tr><td>Ich bin durstig.</td><td class="hr">Žedan sam.</td><td class="hr">Žedn<b>a</b> sam.</td></tr>
    </tbody></table></div>
    <p>Das <em>a</em> in der Mitte (umor<b>a</b>n) fällt bei der Frauenform weg: umoran → umorna.</p>
    <p><strong>du oder Sie?</strong> Zu Fremden, älteren Leuten und im Laden sagst du <em>Vi</em>. Freunde und Kinder duzt du mit <em>ti</em>.</p>
    <ul><li><em>Kako si?</em> – Wie geht’s dir?</li><li><em>Kako ste?</em> – Wie geht es Ihnen?</li></ul>`},
  x:[{de:'(Eine Frau sagt:) Ich bin müde.', s:'___ sam.', o:['Umorna','Umoran','Umorno'], why:'Frau → Endung -a.'},
     {de:'(Ein Mann sagt:) Ich bin hungrig.', s:'___ sam.', o:['Gladan','Gladna','Gladno'], why:'Mann → Grundform ohne Endung.'},
     {de:'Wie geht es dir?', s:'Kako ___?', o:['si','ste','sam'], why:'du → si.'},
     {de:'Mir geht es gut.', s:'Dobro ___.', o:['sam','si','je'], why:'Wörtlich: «Gut bin ich.»'},
     {de:'Sie (eine Frau) ist sehr müde.', s:'Ona je jako ___.', o:['umorna','umoran','umorni'], why:'ona → Frauenform -a.'}],
  d:[{ctx:'Deine Vermieterin begrüsst dich am Morgen.', line:'Dobro jutro! Kako ste?', lineDe:'Guten Morgen! Wie geht es Ihnen?', o:['Dobro sam, hvala. A Vi?','Dobro jutro, ne razumijem.','Laku noć!']},
     {ctx:'Der Kellner zählt sehr schnell die Tagesgerichte auf.', line:'Danas imamo svježu ribu, lignje i domaće vino…', lineDe:'Heute haben wir frischen Fisch, Tintenfisch und Hauswein…', o:['Polako, molim. Ne razumijem.','Dobro sam, hvala.','Umoran sam.']},
     {ctx:'Nach einer langen Wanderung fragt dich ein Freund (du bist ein Mann):', line:'Kako si?', lineDe:'Wie geht’s dir?', o:['Malo sam umoran, ali dobro.','Kako ste, hvala.','Doviđenja, dobro.']},
     {ctx:'Eine Bekannte erzählt:', line:'Danas nisam baš dobro.', understand:true, o:['Heute geht es mir nicht so gut.','Heute geht es mir sehr gut.','Heute habe ich keine Zeit.']}]
});

CH.push({
  t:'Zahlen 1–10', s:'Zählen und Preise verstehen',
  v:[['jedan','eins'],['dva','zwei'],['tri','drei'],['četiri','vier'],['pet','fünf'],
     ['šest','sechs'],['sedam','sieben'],['osam','acht'],['devet','neun'],['deset','zehn']],
  p:[['Koliko košta?','Wie viel kostet das?'],['Pet eura.','Fünf Euro.'],['Jedan euro.','Ein Euro.'],
     ['Dva eura, molim.','Zwei Euro, bitte.'],['To je deset eura.','Das macht zehn Euro.'],['Soba broj sedam.','Zimmer Nummer sieben.'],
     ['Imate li sitno?','Haben Sie Kleingeld?'],['Evo, izvolite.','Hier, bitte schön.','Das sagst du, wenn du etwas überreichst, zum Beispiel Geld.']],
  g:{t:'Zahlen und Euro', h:`
    <p>Die Zahlen 1 und 2 passen sich dem Wort danach an – wie «dobar» in Kapitel 1.</p>
    <div class="tbl"><table><thead><tr><th></th><th>männlich</th><th>weiblich</th><th>sächlich</th></tr></thead><tbody>
    <tr><td>1</td><td class="hr">jedan</td><td class="hr">jedna</td><td class="hr">jedno</td></tr>
    <tr><td>2</td><td class="hr">dva</td><td class="hr">dvije</td><td class="hr">dva</td></tr>
    </tbody></table></div>
    <p>Beim Euro gibt es nur zwei Formen:</p>
    <ul><li><em>jedan euro</em> – 1 Euro</li><li><em>dva eura, pet eura, deset eura</em> – ab 2 immer <strong>eura</strong></li></ul>
    <div class="tip">Seit 2023 zahlt man in Kroatien mit Euro. Cent heisst <em>cent</em>.</div>`},
  x:[{de:'Ein Euro.', s:'___ euro.', o:['Jedan','Jedna','Jedno'], why:'euro ist männlich → jedan.'},
     {de:'Drei Euro.', s:'Tri ___.', o:['eura','euro','eure'], why:'Ab 2 heisst es eura.'},
     {de:'Acht Euro.', s:'Osam ___.', o:['eura','euro','eure'], why:'Ab 2 heisst es eura.'},
     {de:'Wie viel kostet das?', s:'Koliko ___?', o:['košta','koštam','kako'], why:'košta = es kostet.'},
     {de:'Zwei Euro.', s:'___ eura.', o:['Dva','Dvije','Dvoje'], why:'dva für männliche Wörter wie euro, dvije für weibliche.'}],
  d:[{ctx:'Am Kiosk sagt die Verkäuferin:', line:'Sedam eura, molim.', understand:true, o:['Sieben Euro, bitte.','Acht Euro, bitte.','Sechs Euro, bitte.'], why:'sedam = 7, osam = 8, šest = 6.'},
     {ctx:'Beim Check-in:', line:'Vaša soba je broj devet.', understand:true, o:['Ihr Zimmer ist Nummer neun.','Ihr Zimmer ist Nummer zehn.','Ihr Zimmer ist Nummer zwei.']},
     {ctx:'Du willst wissen, was die Glace kostet.', line:null, o:['Koliko košta?','Kako ste?','Kako se zovete?']},
     {ctx:'Du bezahlst und reichst das Geld hin.', line:'Četiri eura.', lineDe:'Vier Euro.', o:['Evo, izvolite.','Nema na čemu.','Laku noć.']}]
});

CH.push({
  t:'Im Café', s:'Getränke bestellen',
  v:[['kava','Kaffee','f'],['čaj','Tee','m'],['voda','Wasser','f'],['pivo','Bier','n'],['vino','Wein','n'],
     ['sok','Saft','m'],['mlijeko','Milch','n'],['šećer','Zucker','m'],['čaša','Glas','f'],['konobar','Kellner','m']],
  p:[['Kava, molim.','Kaffee, bitte.'],['Za mene čaj.','Für mich einen Tee.'],['Ja ću pivo.','Ich nehme ein Bier.','«Ja ću…» heisst wörtlich «Ich werde…» und ist die übliche Art zu bestellen.'],
     ['Kava s mlijekom, molim.','Kaffee mit Milch, bitte.'],['Bez šećera.','Ohne Zucker.'],['Još jedno pivo, molim.','Noch ein Bier, bitte.'],
     ['To je sve, hvala.','Das ist alles, danke.'],['Oprostite, možemo naručiti?','Entschuldigung, können wir bestellen?','Mit «Oprostite» sprichst du den Kellner an.']],
  g:{t:'Männlich, weiblich, sächlich', h:`
    <p>Jedes Nomen hat ein Geschlecht. Zum Glück erkennst du es fast immer an der Endung:</p>
    <div class="tbl"><table><thead><tr><th>Endung</th><th>Geschlecht</th><th>Beispiele</th></tr></thead><tbody>
    <tr><td>Konsonant</td><td>männlich</td><td class="hr">čaj, sok, šećer, konobar</td></tr>
    <tr><td><b>-a</b></td><td>weiblich</td><td class="hr">kava, voda, čaša</td></tr>
    <tr><td><b>-o</b> / <b>-e</b></td><td>sächlich</td><td class="hr">pivo, vino, mlijeko</td></tr>
    </tbody></table></div>
    <p>Das Geschlecht bestimmt die Form von «ein»: <em>jedan čaj</em>, <em>jedna kava</em>, <em>jedno pivo</em>.</p>
    <div class="tip">Ausnahmen gibt es, aber wenige. In den Wortlisten steht das Geschlecht als m, f oder n.</div>`},
  x:[{de:'ein Kaffee', s:'___ kava', o:['jedna','jedan','jedno'], why:'kava endet auf -a → weiblich → jedna.'},
     {de:'ein Bier', s:'___ pivo', o:['jedno','jedan','jedna'], why:'pivo endet auf -o → sächlich → jedno.'},
     {de:'ein Tee', s:'___ čaj', o:['jedan','jedna','jedno'], why:'čaj endet auf Konsonant → männlich → jedan.'},
     {de:'ein Glas', s:'___ čaša', o:['jedna','jedan','jedno'], why:'čaša → weiblich.'},
     {de:'ein Wein', s:'___ vino', o:['jedno','jedna','jedan'], why:'vino → sächlich.'}],
  d:[{ctx:'Der Kellner kommt an deinen Tisch.', line:'Izvolite?', lineDe:'Bitte? (Was darf es sein?)', o:['Kava s mlijekom, molim.','Doviđenja!','Ja sam iz Švicarske.']},
     {ctx:'Der Kellner fragt nach:', line:'S mlijekom ili bez?', lineDe:'Mit Milch oder ohne?', o:['Bez mlijeka, hvala.','Mlijeko je.','Bez, dobra večer.'], why:'bez + Genitiv: mlijeko → bez mlijeka.'},
     {ctx:'Du möchtest noch ein Bier.', line:null, o:['Još jedno pivo, molim.','Još jedan pivo, molim.','Pivo je, hvala.'], why:'pivo ist sächlich → jedno.'},
     {ctx:'Der Kellner sagt:', line:'Kava i sok, to je pet eura.', understand:true, o:['Kaffee und Saft, das macht fünf Euro.','Kaffee und Tee, das macht fünf Euro.','Kaffee und Saft, das macht sieben Euro.']}]
});

CH.push({
  t:'Bestellen', s:'Was du willst: der Akkusativ',
  v:[['želim','ich will / möchte'],['trebam','ich brauche'],['sladoled','Glace','m'],['kroasan','Gipfeli','m'],['sendvič','Sandwich','m'],
     ['led','Eis (zum Kühlen)','m'],['boca','Flasche','f'],['ili','oder'],['još','noch'],['bez','ohne']],
  p:[['Jednu kavu, molim.','Einen Kaffee, bitte.'],['Želim jedan sladoled.','Ich möchte eine Glace.'],['Mogu li dobiti vodu?','Kann ich ein Wasser bekommen?'],
     ['Malu kavu s mlijekom, molim.','Einen kleinen Kaffee mit Milch, bitte.'],['Jedan kroasan i jednu kavu.','Ein Gipfeli und einen Kaffee.'],['S ledom, molim.','Mit Eis, bitte.'],
     ['Bocu vode, molim.','Eine Flasche Wasser, bitte.'],['Trebam čašu.','Ich brauche ein Glas.'],['Mogu li platiti karticom?','Kann ich mit Karte zahlen?']],
  g:{t:'Der Akkusativ: was du bestellst', h:`
    <p>Was du bestellst, möchtest oder brauchst, steht im <strong>Akkusativ</strong>. Gute Nachricht: Sichtbar ändern sich nur weibliche Wörter auf <em>-a</em>.</p>
    <div class="tbl"><table><thead><tr><th>Geschlecht</th><th>Grundform</th><th>Bestellung</th></tr></thead><tbody>
    <tr><td>weiblich (-a)</td><td class="hr">jedna mala kava</td><td class="hr">jedn<b>u</b> mal<b>u</b> kav<b>u</b></td></tr>
    <tr><td>männlich</td><td class="hr">jedan sladoled</td><td class="hr">jedan sladoled</td></tr>
    <tr><td>sächlich (-o, -e)</td><td class="hr">jedno pivo</td><td class="hr">jedno pivo</td></tr>
    </tbody></table></div>
    <p>Merke dir einfach: <strong>-a wird zu -u</strong>. Auch beim Adjektiv davor.</p>

function bounds(len){ const tot = DAY_WEIGHTS.reduce((a,b)=>a+b,0); let c=0; const b=[0]; DAY_WEIGHTS.forEach(w=>{ c+=w; b.push(Math.round(len*c/tot)); }); return b; }

function range(ci, kind, [a,b]){ const o=[]; for(let i=a;i<b;i++) o.push(mkItem(ci,kind,i)); return o; }
function newItemsOfDay(n){
  const ci=Math.floor(n/5), k=n%5, ch=CH[ci], bv=bounds(ch.v.length), bp=bounds(ch.p.length);
  return [...range(ci,'v',[bv[k],bv[k+1]]), ...range(ci,'p',[bp[k],bp[k+1]])];
}
const DAY_OF = {}; const ALL = []; const BY_ID = {};
for(let n=0;n<NDAYS;n++) newItemsOfDay(n).forEach(it => { DAY_OF[it.id]=n; ALL.push(it); BY_ID[it.id]=it; });

/* Lesehilfe: grobe Umschrift in deutscher Schreibweise */
function lese(s){
  // Fremde Namen (Zürich, Bern) bleiben unverändert
  return String(s).split(' ').map(w => /[äöüßqwxy]/i.test(w) ? w.toLowerCase() : leseWord(w)).join(' ');
}
function leseWord(s){
  const t = String(s).toLowerCase(); let o='';
  for(let i=0;i<t.length;i++){
    const c=t[i], n=t[i+1];
    if(c==='d' && n==='ž'){ o+='dsch'; i++; continue; }
    if((c==='l'||c==='n') && n==='j'){ o+=c+'j'; i++; continue; }
    o += ({c:'z','č':'tsch','ć':'tj','đ':'dj','š':'sch','ž':'sch',z:'s',s:'ss',v:'w',h:'ch'})[c] ?? c;
  }
  return o.replace(/eu/g,'e-u').replace(/ei/g,'e-i').replace(/[«»]/g,'');
}

const sync = {db:null, uid:null, timer:null, busy:false, again:false, state:'local'};
const DOC = () => 'data/users/'+sync.uid+'/progress2';
function queueRemote(){ if(!sync.db) return; clearTimeout(sync.timer); sync.timer = setTimeout(pushRemote, 1500); }
async function pushRemote(){
  if(!sync.db) return;
  if(sync.busy){ sync.again = true; return; }
  sync.busy = true;
  try { await sync.db.doc(DOC()).set(JSON.parse(JSON.stringify(P))); sync.state='account'; }
  catch(e){ if(e && (e.code==='invalid_argument' || e.code==='revoked' || e.code==='not_granted')){ sync.db=null; sync.state='local'; } }
  sync.busy = false; updateSyncNote();
  if(sync.again){ sync.again=false; pushRemote(); }
}
async function initSync(){
  try {
    if(!window.claude || typeof window.claude.use !== 'function') return;
    const [user, db] = await Promise.all([window.claude.use('user'), window.claude.use('db')]);
    if(!user || !db) return;
    const uid = await user.id(); if(!uid) return;
    sync.uid = uid;
    const snap = await db.doc(DOC()).get();
    sync.db = db; sync.state = 'account';
    if(snap.exists){
      const r = snap.data() || {};
      if((r.updatedAt||0) > (P.updatedAt||0)){ P = Object.assign(blank(), JSON.parse(JSON.stringify(r))); saveLocal(); if(R.view!=='lesson') render(); }
      else if((P.updatedAt||0) > (r.updatedAt||0)) queueRemote();
    } else if(P.updatedAt) queueRemote();
    updateSyncNote();
  } catch(e){ /* stays local */ }
}

let voice = null, voiceKind = 'none', spTimer = null;
function pickVoice(){
  try {
    const vs = speechSynthesis.getVoices();
    const hr = vs.filter(v => /^hr/i.test(v.lang));
    const near = vs.filter(v => /^(bs|sr|sh)/i.test(v.lang));
    voice = hr.find(v=>/natural|online/i.test(v.name)) || hr[0] || near.find(v=>/latn|natural/i.test(v.name+v.lang)) || near[0] || null;
    voiceKind = hr.length ? 'hr' : (near.length ? 'near' : 'none');
  } catch(e){ voice=null; voiceKind='none'; }
}
const hasVoice = () => !!voice;
function speak(text, slow){
  if(!voice || !text) return;
  try { speechSynthesis.cancel(); } catch(e){}
  clearTimeout(spTimer);
  spTimer = setTimeout(() => {
    try {
      const u = new SpeechSynthesisUtterance(String(text).replace(/[«»…]/g,''));
      u.voice = voice; u.lang = voice.lang;
      u.rate = slow ? 0.6 : (P.rate==='slow' ? 0.8 : 0.95);
      speechSynthesis.speak(u);
    } catch(e){}
  }, 90);
}
const sayBtn = (t, cls='') => hasVoice() ? `<button class="say ${cls}" data-say="${esc(t)}" aria-label="Anhören" title="Anhören">${ICON_SAY}</button>` : '';
if('speechSynthesis' in window){
  pickVoice();
  speechSynthesis.addEventListener?.('voiceschanged', () => { const had=hasVoice(); pickVoice(); if(had!==hasVoice() && R.view!=='lesson') render(); });
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
let micState = SR ? 'ready' : 'none';
const NUM1 = ['nula','jedan','dva','tri','četiri','pet','šest','sedam','osam','devet','deset','jedanaest','dvanaest','trinaest','četrnaest','petnaest','šesnaest','sedamnaest','osamnaest','devetnaest'];
const NUM10 = {2:'dvadeset',3:'trideset',4:'četrdeset',5:'pedeset',6:'šezdeset',7:'sedamdeset',8:'osamdeset',9:'devedeset'};
const numWord = x => { x=+x; if(x<20) return NUM1[x]; if(x===100) return 'sto'; if(x<100){ const t=Math.floor(x/10), u=x%10; return NUM10[t]+(u?' '+NUM1[u]:''); } return String(x); };
function lev(a,b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let p=Array.from({length:n+1},(_,j)=>j); for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[n]; }
function similarity(heard, target){
  const a = plain(String(heard).replace(/\d+/g, numWord)), b = plain(target);
  if(!a) return 0;
  return 1 - lev(a,b)/Math.max(a.length,b.length);
}

const optN = n => n<3 ? 3 : 4;
function nearPool(it, n){
  const ok = x => x.kind===it.kind && x.id!==it.id && norm(x.de)!==norm(it.de) && norm(x.hr)!==norm(it.hr);
  let pool = ALL.filter(x => ok(x) && DAY_OF[x.id] <= n);
  if(pool.length < 6) pool = ALL.filter(x => ok(x) && x.ci <= it.ci+1);
  if(pool.length < 4) pool = ALL.filter(ok);
  return shuffle(pool).sort((a,b) => Math.abs(a.ci-it.ci) - Math.abs(b.ci-it.ci)).slice(0, 10);
}
function exPick(it, dir, n){
  const key = dir==='hr2de' ? 'de' : 'hr';
  const opts = shuffle(uniq([it[key], ...nearPool(it,n).map(x=>x[key])]).slice(0, optN(n)));
  return {type:'pick', dir, item:it, n, options:opts, answer:opts.indexOf(it[key]), graded:true};
}
function exListen(it, n){
  if(!hasVoice()) return exPick(it,'hr2de',n);
  const ex = exPick(it,'hr2de',n); ex.type='listen'; return ex;
}
function tilesFor(words, extra){ return shuffle([...words, ...extra]).map(t=>({t})); }
function exBuild(it, n){
  const toks = tokens(it.hr);
  const disp = toks.map((t,i) => i===0 && !PROPER.has(t) ? lc1(t) : t);
  const have = new Set(disp.map(t=>t.toLowerCase()));
  const others = uniq(nearPool(it,n).flatMap(x=>tokens(x.hr)).map(t=>PROPER.has(t)?t:t.toLowerCase())).filter(t=>!have.has(t.toLowerCase()));
  const extra = shuffle(others).slice(0, n<5?1:n<15?2:3);
  return {type:'build', item:it, n, tiles:tilesFor(disp, extra), target:norm(toks.join(' ')), graded:true};
}
function exBuildDe(it, n, hide){
  const toks = tokens(it.de);
  const have = new Set(toks.map(t=>t.toLowerCase()));
  const others = uniq(nearPool(it,n).flatMap(x=>tokens(x.de))).filter(t=>!have.has(t.toLowerCase()));
  const extra = shuffle(others).slice(0, n<5?1:n<15?2:3);
  return {type:'buildDe', item:it, n, hide:!!hide && hasVoice(), tiles:tilesFor(toks, extra), target:norm(toks.join(' ')), graded:true};
}
const exType = it => ({type:'type', item:it, graded:true});
const exDict = it => hasVoice() ? ({type:'dict', item:it, graded:true}) : exType(it);
const exIntro = it => ({type:'intro', item:it});
const exSpeak = it => ({type:'speak', item:it});
function exMatch(items){ const idx = items.map((_,i)=>i); return {type:'match', items, left:shuffle(idx), right:shuffle(idx)}; }
function exGap(g, ci){ const opts = shuffle(g.o); return {type:'gap', g, ci, options:opts, answer:opts.indexOf(g.o[0]), graded:true}; }
function exDialog(d, ci, n){ const opts = shuffle(d.o); return {type:'dialog', d, ci, n, hide: !!d.understand && hasVoice() && n>=15, options:opts, answer:opts.indexOf(d.o[0]), graded:true}; }
const deOK = it => !/[\/()]/.test(it.de) && wc(it.de) <= 10;

function practice(it, n, hard, flip){
  const v = hasVoice(), w = wc(it.hr), r = Math.random();
  if(it.vocab){
    if(!hard) return exPick(it, flip?'hr2de':'de2hr', n);
    if(n>=12 && r<.4) return exType(it);
    if(v && n>=3 && r<.7) return exListen(it,n);
    return exPick(it, flip?'de2hr':'hr2de', n);
  }
  if(!hard){
    if(n<3) return exPick(it, flip?'hr2de':'de2hr', n);
    if(flip) return v ? exListen(it,n) : exPick(it,'hr2de',n);
    return w<=8 ? exBuild(it,n) : exPick(it,'de2hr',n);
  }
  if(v && n>=20 && w<=6 && r<.3) return exDict(it);
  if(n>=25 && w<=5 && r<.5) return exType(it);
  if(flip) return deOK(it) ? exBuildDe(it,n, v && n>=15 && Math.random()<.5) : (v ? exListen(it,n) : exPick(it,'hr2de',n));
  return w<=10 ? exBuild(it,n) : exPick(it,'de2hr',n);
}
function reviewItems(n, m, exclude){
  const before = ALL.filter(it => DAY_OF[it.id] < n && !exclude.has(it.id));
  const due = before.filter(it => P.items[it.id] && P.items[it.id].d <= Date.now()).sort((a,b)=>P.items[a.id].d-P.items[b.id].d);
  let pick = due.slice(0,m);
  if(pick.length < m){
    const rest = shuffle(before.filter(it=>!pick.includes(it))).sort((a,b)=>((P.items[a.id]||{}).s||0)-((P.items[b.id]||{}).s||0));
    pick = pick.concat(rest.slice(0, m-pick.length));
  }
  return pick;
}

function buildDay(n){
  const ci=Math.floor(n/5), k=n%5, ch=CH[ci], v=hasVoice();
  let flip=false; const f = () => (flip=!flip);
  const out = [];
  // Wörter früherer Tage, die noch nie vorkamen (z. B. nach einer Kurs-Erweiterung), werden nachgeholt.
  const missed = ALL.filter(it => DAY_OF[it.id] < n && !P.items[it.id]).slice(0, 5);
  const fresh = [...missed, ...newItemsOfDay(n)];
  const freshIds = new Set(fresh.map(x=>x.id));
  const so = ALL.filter(it => it.ci===ci && DAY_OF[it.id] < n && !freshIds.has(it.id));
  const fv = fresh.filter(x=>x.vocab), fp = fresh.filter(x=>!x.vocab);
  // Neue Wörter: in Gruppen vorstellen, dann Paare finden; neue Sätze vorstellen
  const intro = [];
  chunk(fv, n<5 ? 4 : 5).forEach(g => {
    g.forEach(it=>intro.push(exIntro(it)));
    if(g.length>=3) intro.push(exMatch(shuffle(g)));
    else g.forEach(it=>intro.push(practice(it,n,false,f())));
  });
  fp.forEach(it => { intro.push(exIntro(it)); if(n<10) intro.push(practice(it,n,false,f())); });
  // Danach jedes neue Wort/jeden Satz (fast) nochmals üben – abwechselnd in beide Richtungen
  const pv = shuffle(fv).slice(0, Math.min(fv.length, Math.ceil(fv.length*0.7)+1));
  const prac = shuffle([...pv.map((it,i)=>practice(it,n,i%2===1,f())), ...fp.map(it=>practice(it,n,true,f()))]);
  const spk = shuffle(fp.length ? fp : fv).slice(0, k===2 ? 1 : 2).map(exSpeak);
  if(n===0) out.push({type:'info'});
  if(k===0 || k===1){
    const rev = reviewItems(n, 4, freshIds).map(it=>practice(it,n,true,f()));
    out.push(...intro, ...weave(prac, rev, spk));
  } else if(k===2){
    out.push({type:'grammar', ci});
    const pr = shuffle(so).slice(0,3).map(it=>practice(it,n,true,f()));
    out.push(...weave(shuffle(ch.x).map(g=>exGap(g,ci)), pr));
    const rev = reviewItems(n, 2, new Set([...freshIds, ...so.map(x=>x.id)])).map(it=>practice(it,n,true,f()));
    out.push(...intro, ...weave(prac, rev, spk));
  } else if(k===3){
    const half = Math.ceil(ch.d.length/2);
    const dia = shuffle(ch.d.slice(0, half)).slice(0, 3).map(d=>exDialog(d,ci,n));
    const rev = [...shuffle(so).slice(0,2), ...reviewItems(n, 1, new Set([...freshIds, ...so.map(x=>x.id)]))].map(it=>practice(it,n,true,f()));
    out.push(...intro, ...weave(prac, dia, rev, spk));
  } else {
    const all = shuffle(so), ph = all.filter(x=>!x.vocab);
    const L1 = ph.slice(0,3).map(it => v ? exListen(it,n) : exPick(it,'hr2de',n));
    const B = ph.slice(3,5).map(it => (v && n>=20 && wc(it.hr)<=7) ? exDict(it) : (deOK(it) ? exBuildDe(it,n,v) : exBuild(it,n)));
    const half = Math.ceil(ch.d.length/2);
    const D = [...ch.d.slice(half), ...shuffle(ch.d.slice(0,half)).slice(0,1)].map(d=>exDialog(d,ci,n));
    const S = shuffle(ph).slice(0,2).map(exSpeak);
    const G = ch.x.length ? [exGap(shuffle(ch.x)[0],ci)] : [];
    const Rv = reviewItems(n, 1, new Set([...freshIds, ...so.map(x=>x.id)])).map(it=>practice(it,n,true,f()));
    out.push(...intro, ...weave(prac, L1, D, S, B, G, Rv));
  }
  return out.filter(Boolean);
}
function buildPractice(kind){
  const n = nextDay(), L0 = learned();
  let flip=false; const f = () => (flip=!flip);
  const ph = L0.filter(x=>!x.vocab);
  if(kind==='due') return dueList().slice(0,15).map(id=>practice(itemById(id),n,true,f()));
  if(kind==='listen') return shuffle(ph.length>=3?ph:L0).slice(0,10).map((it,i) => {
    if(!hasVoice()) return exPick(it,'hr2de',n);
    if(i%3===1 && wc(it.hr)<=7) return exDict(it);
    if(i%3===2 && deOK(it) && !it.vocab) return exBuildDe(it,n,true);
    return exListen(it,n);
  });
  if(kind==='speak') return shuffle(ph.length>=3?ph:L0).slice(0,8).map(exSpeak);
  return shuffle(L0).slice(0,15).map(it=>practice(it,n,true,f()));
}
function cloneEx(ex){
  switch(ex.type){
    case 'pick': return exPick(ex.item, ex.dir, ex.n);
    case 'listen': return exListen(ex.item, ex.n);
    case 'build': return exBuild(ex.item, ex.n);
    case 'buildDe': return exBuildDe(ex.item, ex.n, ex.hide);
    case 'type': return exType(ex.item);
    case 'dict': return exDict(ex.item);
    case 'gap': return exGap(ex.g, ex.ci);
    case 'dialog': return exDialog(ex.d, ex.ci, ex.n);
  }
  return null;
}
const lessonMinutes = n => Math.max(5, Math.round(buildDay(n).length * 0.4));

function render(){
  if(R.view==='lesson'){ renderLesson(); return; }

function dayPlan(n){
  const ci=Math.floor(n/5), k=n%5, ch=CH[ci], fresh=newItemsOfDay(n);
  const nv=fresh.filter(x=>x.vocab).length, np=fresh.length-nv;
  const words = [nv?`${nv} neue Wörter`:'', np?`${np} neue ${np===1?'Satz':'Sätze'}`:''].filter(Boolean).join(', ');
  if(k===0||k===1) return [words, 'Hören und verstehen, in beide Richtungen üben', 'Nachsprechen', n>0?'Wiederholung von früher':''].filter(Boolean);
  if(k===2) return [`Grammatik: ${ch.g.t}`, `${ch.x.length} Lückensätze zur Regel`, words].filter(Boolean);
  if(k===3) return [words, 'Gesprächssituationen: verstehen und antworten', 'Nachsprechen'];
  return [words, 'Hörverständnis und Diktat', 'Gesprächssituationen und Nachsprechen'].filter(Boolean);
}

function phraseGroups(q){
  const k = plain(q);
  const out = CH.map((ch,ci) => {
    const ps = [...ch.p, ...ch.v.map(v=>[v[0], v[1]])].filter(p => !k || plain(p[0]).includes(k) || plain(p[1]).includes(k));
    if(!ps.length) return '';

  }).join('');
  return out || `<p class="empty">Nichts gefunden für «${esc(q)}».</p>`;
}

function viewGrammar(){
  return `<p class="eyebrow">Grammatik</p><h1>Das Gerüst hinter den Sätzen</h1>
    <p class="lead">Jedes Kapitel bringt eine Regel – genau die, die du für die Sätze des Kapitels brauchst. Hier sind alle 30 zum Nachlesen.</p>
    ${CH.map((ch,ci)=>`<article class="gram"><p class="eyebrow">Kapitel ${ci+1} · Tag ${ci*5+3} · ${esc(ch.t)}</p><h3>${esc(ch.g.t)}</h3>${ch.g.h}<div class="row" style="margin-top:14px"><button class="link" data-ch="${ci}">Zum Kapitel →</button></div></article>`).join('')}`;
}

/* ------------------------------------------------------------------ */
/*  LESSON PLAYER                                                       */
/* ------------------------------------------------------------------ */
const GRADED = new Set(['pick','listen','build','buildDe','type','dict','gap','dialog']);
const OPT_TYPES = ['pick','listen','gap','dialog'];
const cur = () => L.queue[L.i];

function startLesson(mode, exs, day){
  if(!exs.length) return;
  L = {mode, day, queue:exs, i:0, answered:false, sel:null, built:[], ok:0, total:exs.filter(e=>GRADED.has(e.type)).length, mistakes:[], requeued:new Set(), res:{}, seen:new Set(), m:null, spoke:0, rec:null};
  exs.forEach((e,i)=>{ e.key=i; });
  R = {view:'lesson'};
  render(); window.scrollTo(0,0);
}

function renderLesson(){
  const ex = cur();
  const pct = Math.round((L.i / L.queue.length) * 100);
  L.answered = !GRADED.has(ex.type) && ex.type!=='match';
  if(ex.type==='match') L.m = {l:null, r:null, done:new Set(), err:0, bad:null};
  if(ex.item && (ex.type==='intro')) L.seen.add(ex.item.id);
  app.innerHTML = `<div class="lesson">
    <div class="l-top"><button class="x" id="quit" aria-label="Lektion beenden">×</button><div class="bar"><span style="width:${pct}%"></span></div><span class="count">${L.i+1} / ${L.queue.length}</span></div>
    <section class="ex" id="ex">${exHTML(ex)}</section>
    <div class="check" id="check"><div class="fb" id="fb"><span class="hint">${hintFor(ex)}</span></div><button class="btn primary" id="checkBtn" ${L.answered?'':'disabled'}>${L.answered?'Weiter':'Prüfen'}</button></div>
  </div>`;
  if(ex.type==='build' || ex.type==='buildDe') renderTiles();
  if(ex.type==='match') renderMatch();
  if(ex.type==='type' || ex.type==='dict'){ const inp=$('#typed'); if(ex.type==='type') inp.focus({preventScroll:true}); inp.addEventListener('input',()=>setCan(inp.value.trim().length>0)); }
  autoAudio(ex);
}
function autoAudio(ex){
  if(!hasVoice()) return;
  const must = ['listen','dict'].includes(ex.type) || (ex.type==='buildDe' && ex.hide) || (ex.type==='dialog' && ex.hide);
  if(!must && P.auto===false) return;
  let t = '';
  if(['intro','listen','dict','speak','buildDe'].includes(ex.type) || (ex.type==='pick' && ex.dir==='hr2de')) t = ex.item.hr;
  else if(ex.type==='dialog' && ex.d.line) t = ex.d.line;
  if(t) setTimeout(()=>speak(t), 250);
}
function hintFor(ex){
  switch(ex.type){
    case 'info': case 'grammar': return 'Lies in Ruhe, dann weiter.';
    case 'intro': return hasVoice() ? 'Hör gut zu und sprich leise mit.' : 'Lies das Wort laut.';
    case 'speak': return 'Sprich laut nach, dann weiter.';
    case 'match': return 'Tippe links ein kroatisches Wort an, dann rechts die passende Übersetzung.';
    case 'type': case 'dict': return 'Enter zum Prüfen. Fehlende Sonderzeichen zählen als richtig.';
    case 'build': case 'buildDe': return 'Tippe die Wörter in der richtigen Reihenfolge an.';
  }
  return 'Tasten 1–4 wählen, Enter prüft.';
}
function setCan(on){ const b=$('#checkBtn'); if(b && !L.answered) b.disabled = !on; }
const dirTag = s => `<span class="dir">${s}</span>`;
function optsHTML(opts, lang, cls='opts'){
  return `<div class="${cls}" role="group">${opts.map((o,i)=>`<button class="opt ${lang==='hr'?'hr':''}" data-opt="${i}"><kbd>${i+1}</kbd><span>${esc(o)}</span></button>`).join('')}</div>`;
}
function listenBlock(text, hide){
  return `<div class="listen">
    <button class="play big" data-say="${esc(text)}">${ICON_SAY} Abspielen</button>
    <button class="play slow" data-say="${esc(text)}" data-slow="1">Langsam</button>
    ${hide?`<button class="link" id="reveal">Text anzeigen</button>`:''}
    <p class="ltext hr" id="ltext"${hide?' hidden':''}>${esc(text)}</p>
  </div>`;
}
const leseLine = hr => P.lese!==false ? `<div class="lese">Lesehilfe: <i>${esc(lese(hr))}</i></div>` : '';
const LETTERS = [['č','hartes tsch','čaj'],['ć','weiches tsch','noć'],['š','sch','šećer'],['ž','weiches sch','plaža'],['c','wie z','cijena'],['z','weiches s','zub'],['v','wie w','voda'],['h','wie ch','hvala']];

function exHTML(ex){
  const it = ex.item;
  switch(ex.type){
    case 'info': return `<p class="kicker">Willkommen</p><h2>So lernst du mit Pomalo</h2>
      <div class="info" style="margin-top:14px">
        <p>Jeden Tag eine Lektion von etwa 10 bis 15 Minuten. Neue Wörter hörst du zuerst. Dann übst du sie in beide Richtungen – Kroatisch → Deutsch und Deutsch → Kroatisch – und sprichst sie nach.</p>
        <p><strong>Mach den Ton an.</strong> Kroatisch spricht man fast so, wie man es schreibt. Diese Buchstaben klingen anders als im Deutschen – tippe zum Anhören:</p>
        <div class="letters">${LETTERS.map(([l,d,w])=>`<div>${sayBtn(w,'sm')}<b>${l}</b><span>${d}<br><i class="hr">${w}</i></span></div>`).join('')}</div>
        <p>Unter jedem neuen Wort steht eine <strong>Lesehilfe</strong> in deutscher Schreibweise. Sie ist nur ungefähr – das Vorbild ist immer der Ton.</p>
      </div>`;
    case 'grammar': { const ch=CH[ex.ci]; return `<p class="kicker">Grammatik · Kapitel ${ex.ci+1}</p><h2>${esc(ch.g.t)}</h2><div class="gram" style="margin-top:14px">${ch.g.h}</div>`; }
    case 'intro': return `<p class="kicker">${it.vocab?'Neues Wort':'Neuer Satz'}</p>
      <div class="card">
        <div class="big hr">${sayBtn(it.hr)}<span>${esc(it.hr)}</span>${it.g?`<span class="g" title="${GENDER[it.g]}">${it.g}</span>`:''}</div>
        ${leseLine(it.hr)}
        <div class="de">${esc(it.de)}</div>
        ${it.note?`<div class="note">${esc(it.note)}</div>`:''}
        ${hasVoice()?`<button class="play slow" data-say="${esc(it.hr)}" data-slow="1">Langsam anhören</button>`:''}
      </div>`;
    case 'pick': {
      const h = ex.dir==='hr2de';
      return `<p class="kicker">${h?'Was bedeutet das?':'Wie sagt man das auf Kroatisch?'} ${dirTag(h?'Kroatisch → Deutsch':'Deutsch → Kroatisch')}</p>
        <div class="prompt ${h?'hr':''}">${h?sayBtn(it.hr):''}<span>${esc(h?it.hr:it.de)}</span></div>
        ${optsHTML(ex.options, h?'de':'hr')}`;
    }
    case 'listen': return `<p class="kicker">Hör zu. Was bedeutet das? ${dirTag('Hören → Deutsch')}</p>${listenBlock(it.hr, true)}${optsHTML(ex.options,'de')}`;
    case 'build': return `<p class="kicker">Übersetze ${dirTag('Deutsch → Kroatisch')}</p><p class="prompt">${esc(it.de)}</p>
      <div class="answer" id="ans" aria-label="Deine Antwort"></div><div class="bank" id="bank"></div>`;
    case 'buildDe': return `<p class="kicker">${ex.hide?'Hör zu und übersetze':'Übersetze'} ${dirTag(ex.hide?'Hören → Deutsch':'Kroatisch → Deutsch')}</p>
      ${ex.hide ? listenBlock(it.hr, true) : `<div class="prompt hr">${sayBtn(it.hr)}<span>${esc(it.hr)}</span></div>`}
      <div class="answer" id="ans" aria-label="Deine Antwort"></div><div class="bank" id="bank"></div>`;
    case 'type': return `<p class="kicker">Schreib es auf Kroatisch ${dirTag('Deutsch → Kroatisch')}</p><p class="prompt">${esc(it.de)}</p>${typeBox()}`;
    case 'dict': return `<p class="kicker">Diktat: Schreib, was du hörst ${dirTag('Hören → Kroatisch')}</p>${listenBlock(it.hr,false).replace(/<p class="ltext[^]*?<\/p>/,'')}${typeBox()}`;
    case 'speak': return `<p class="kicker">Hör zu und sprich nach</p>
      <div class="card">
        <div class="big hr">${sayBtn(it.hr)}<span>${esc(it.hr)}</span></div>
        ${leseLine(it.hr)}
        <div class="de">${esc(it.de)}</div>
        ${hasVoice()?`<button class="play slow" data-say="${esc(it.hr)}" data-slow="1">Langsam anhören</button>`:''}
      </div>
      <div id="micArea" style="margin-top:18px">${micHTML()}</div>`;
    case 'match': return `<p class="kicker">Finde die Paare ${dirTag('Kroatisch ↔ Deutsch')}</p><div class="match" id="match"></div>`;
    case 'gap': {
      const [a,b] = ex.g.s.split('___');
      return `<p class="kicker">Ergänze den Satz ${dirTag('Grammatik')}</p>
        <p class="gap hr">${esc(a)}<span class="slot" id="slot">&nbsp;</span>${esc(b)}</p>
        <p class="sub">${esc(ex.g.de)}</p>
        ${optsHTML(ex.options,'hr','chips')}`;
    }
    case 'dialog': {
      const d = ex.d;
      const bubble = d.line ? (ex.hide
        ? `<div class="bubble"><div>${listenBlock(d.line,true)}</div></div>`
        : `<div class="bubble">${sayBtn(d.line)}<p class="hr">${esc(d.line)}</p></div>`) : '';
      return `<p class="kicker">Situation</p><p class="ctx">${esc(d.ctx)}</p>${bubble}
        <p class="kicker">${d.understand?'Was bedeutet das?':'Was sagst du?'}</p>
        ${optsHTML(ex.options, d.understand?'de':'hr')}`;
    }
  }
  return '';
}
const typeBox = () => `<input id="typed" class="typed" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Antwort eingeben" aria-label="Antwort auf Kroatisch">
  <div class="dia">${DIA.map(c=>`<button data-dia="${c}" aria-label="${c} einfügen">${c}</button>`).join('')}</div>`;
const STEPS = `<ol class="steps"><li>Hör dir den Satz an.</li><li>Sprich ihn laut nach – zwei-, dreimal.</li><li>Hör nochmal und vergleiche.</li></ol>`;
function micHTML(){
  if(micState==='none') return STEPS + `<p class="hint" style="margin-top:10px">Dieser Browser erkennt keine Sprache. Laut nachsprechen trainiert trotzdem. In Chrome, Edge oder Safari prüft die App deine Aussprache mit dem Mikrofon.</p>`;
  if(micState==='blocked') return STEPS + `<p class="hint" style="margin-top:10px">Das Mikrofon ist hier nicht freigegeben. Sprich den Satz einfach laut nach – das trainiert genauso.</p>`;
  return `<button class="mic" id="mic"><span class="dot"></span><span id="micLabel">Jetzt sprechen</span></button>
    <div class="micout" id="micOut" aria-live="polite"></div>
    <p class="hint" style="margin-top:6px">Tippe, sprich den Satz – die App sagt dir, wie gut sie dich verstanden hat.</p>`;
}
function startMic(){
  const ex = cur(); if(!SR || micState!=='ready' || L.rec) return;
  const out = $('#micOut'), btn = $('#mic');
  try { speechSynthesis.cancel(); } catch(e){}
  let rec; try { rec = new SR(); } catch(e){ micBlocked(); return; }
  rec.lang = 'hr-HR'; rec.interimResults = false; rec.maxAlternatives = 5; rec.continuous = false;
  L.rec = rec; btn.classList.add('on'); $('#micLabel').textContent = 'Ich höre zu …'; out.className='micout'; out.textContent='';
  rec.onresult = e => {
    const alts = [...e.results[0]].map(a=>a.transcript);
    let best = alts[0], s = 0;
    alts.forEach(a => { const v = similarity(a, ex.item.hr); if(v > s){ s = v; best = a; } });
    L.spoke++;
    const v = s>=.8 ? ['good','Sehr gut! Gut verständlich.'] : s>=.55 ? ['', 'Fast! Hör nochmal genau hin und versuch es erneut.'] : ['bad','Das klang noch anders. Hör zu und versuch es nochmal.'];
    out.className = 'micout ' + v[0];
    out.innerHTML = `<div><b>${v[1]}</b></div><div>Verstanden: <span class="heard">«${esc(best)}»</span></div>`;
  };
  rec.onerror = e => {
    if(['not-allowed','service-not-allowed','audio-capture'].includes(e.error)){ micBlocked(); return; }
    out.className='micout';
    out.textContent = e.error==='no-speech' ? 'Ich habe nichts gehört. Tippe nochmal und sprich deutlich.' : e.error==='network' ? 'Die Spracherkennung braucht eine Internetverbindung.' : 'Hat nicht geklappt. Versuch es nochmal.';
  };
  rec.onend = () => { L && (L.rec = null); const b=$('#mic'); if(b){ b.classList.remove('on'); $('#micLabel').textContent='Nochmal sprechen'; } };
  try { rec.start(); } catch(e){ L.rec=null; micBlocked(); }
}
function micBlocked(){ micState='blocked'; if(L) L.rec=null; const a=$('#micArea'); if(a) a.innerHTML = micHTML(); }
function stopMic(){ if(L && L.rec){ try { L.rec.abort(); } catch(e){} L.rec=null; } }

function renderTiles(){
  const ex = cur(), used = new Set(L.built), de = ex.type==='buildDe' ? ' de' : '';
  $('#ans').innerHTML = L.built.map(i => `<button class="tile${de}" data-tile-out="${i}">${esc(ex.tiles[i].t)}</button>`).join('');
  $('#bank').innerHTML = ex.tiles.map((t,i) => `<button class="tile${de} ${used.has(i)?'used':''}" data-tile="${i}" ${used.has(i)?'tabindex="-1" aria-hidden="true"':''}>${esc(t.t)}</button>`).join('');
  setCan(L.built.length>0);
}
function renderMatch(){
  const ex = cur(), m = L.m;
  const cls = (side, i) => { const c=[]; if(m.done.has(i)) c.push('good','gone'); else if(m.bad && m.bad[side]===i) c.push('bad'); else if(m[side]===i) c.push('sel'); return c.join(' '); };
  $('#match').innerHTML = `<div class="mcol">${ex.left.map(i=>`<button class="opt hr ${cls('l',i)}" data-ml="${i}" ${m.done.has(i)?'disabled':''}><span>${esc(ex.items[i].hr)}</span></button>`).join('')}</div>
    <div class="mcol">${ex.right.map(i=>`<button class="opt ${cls('r',i)}" data-mr="${i}" ${m.done.has(i)?'disabled':''}><span>${esc(ex.items[i].de)}</span></button>`).join('')}</div>`;
}
function matchClick(side, i){
  const ex = cur(), m = L.m; if(L.answered || m.done.has(i)) return;
  m.bad = null; m[side] = i;
  if(side==='l') speak(ex.items[i].hr);
  if(m.l!==null && m.r!==null){
    if(m.l===m.r){ m.done.add(m.l); }
    else { m.err++; m.bad = {l:m.l, r:m.r}; setTimeout(()=>{ if(L && L.m===m){ m.bad=null; renderMatch(); } }, 650); }
    m.l = m.r = null;
  }
  renderMatch();
  if(m.done.size === ex.items.length){
    L.answered = true;
    const box = $('#check'); box.classList.add('ok');
    $('#fb').innerHTML = `<h4>${m.err? 'Alle Paare gefunden' : 'Alle Paare gefunden – fehlerfrei'}</h4>${m.err?`<div class="de">${m.err} ${m.err===1?'Fehlgriff':'Fehlgriffe'} unterwegs.</div>`:''}`;
    const b = $('#checkBtn'); b.disabled=false; b.textContent='Weiter'; b.focus({preventScroll:true});
  }
}

function select(i){
  if(L.answered) return;
  const ex = cur();
  if(!OPT_TYPES.includes(ex.type) || i<0 || i>=ex.options.length) return;
  L.sel = i;
  document.querySelectorAll('[data-opt]').forEach(b => b.classList.toggle('sel', +b.dataset.opt===i));
  if(ex.type==='gap') $('#slot').textContent = ex.options[i];
  if((ex.type==='pick' && ex.dir==='de2hr') || (ex.type==='dialog' && !ex.d.understand)) speak(ex.options[i]);
  setCan(true);
}
function check(){
  const ex = cur();
  let ok = false, note = '', given = '';
  if(OPT_TYPES.includes(ex.type)){
    if(L.sel===null) return;
    ok = L.sel === ex.answer;
    document.querySelectorAll('[data-opt]').forEach(b => { const i=+b.dataset.opt; b.disabled=true; b.classList.remove('sel'); if(i===ex.answer) b.classList.add('good'); else if(i===L.sel) b.classList.add('bad'); });
    if(ex.type==='gap'){ const s=$('#slot'); s.textContent = ex.options[ex.answer]; s.classList.add(ok?'good':'bad'); }
    const t=$('#ltext'); if(t) t.hidden=false; const rv=$('#reveal'); if(rv) rv.remove();
  } else if(ex.type==='build' || ex.type==='buildDe'){
    ok = norm(L.built.map(i=>ex.tiles[i].t).join(' ')) === ex.target;
    document.querySelectorAll('.tile').forEach(b=>b.disabled=true);
    const t=$('#ltext'); if(t) t.hidden=false; const rv=$('#reveal'); if(rv) rv.remove();
  } else if(ex.type==='type' || ex.type==='dict'){
    const inp = $('#typed'); given = inp.value;
    if(!given.trim()) return;
    const a = plain(given), b = plain(ex.item.hr);
    if(norm(given)===norm(ex.item.hr)) ok = true;
    else if(a===b){ ok = true; note = 'Achte auf die Sonderzeichen (č, ć, š, ž, đ).'; }
    else if(b.length>8 && lev(a,b)<=1){ ok = true; note = 'Kleiner Tippfehler – sonst richtig.'; }
    inp.disabled = true; document.querySelectorAll('[data-dia]').forEach(b=>b.disabled=true);
  }
  L.answered = true;
  const d = today(); P.ans[d] = (P.ans[d]||0)+1;
  if(!ex.retry && ok) L.ok++;
  if(ex.item){ L.res[ex.item.id] = (L.res[ex.item.id] ?? true) && ok; }
  if(!ok && !L.requeued.has(ex.key)){
    L.requeued.add(ex.key);
    const c = cloneEx(ex); if(c){ c.key = ex.key; c.retry = true; L.queue.push(c); }
    L.mistakes.push(ex);
  }
  showFeedback(ok, ex, note, ok?'':given);
}
function showFeedback(ok, ex, note, given){
  const box = $('#check'); box.classList.add(ok?'ok':'no');
  let hr='', de='', why='';
  if(ex.item){ hr=ex.item.hr; de=ex.item.de; why=ex.item.note||''; }
  if(ex.type==='gap'){ hr=ex.g.s.replace('___', ex.options[ex.answer]); de=ex.g.de; why=ex.g.why||''; }
  if(ex.type==='dialog'){ const d=ex.d; if(d.understand){ hr=d.line; de=d.o[0]; } else { hr=d.o[0]; de = d.line && d.lineDe ? `Gesagt wurde: «${d.lineDe}»` : ''; } why=d.why||''; }
  if(note) why = note + (why?' '+why:'');
  $('#fb').innerHTML = `<h4>${ok?'Richtig':'Nicht ganz. Richtig ist:'}</h4>
    <div class="ans">${sayBtn(hr)}<span class="hr">${esc(hr)}</span></div>
    ${de?`<div class="de">${esc(de)}</div>`:''}
    ${given?`<div class="de">Deine Antwort: ${esc(given)}</div>`:''}
    ${why?`<div class="why">${esc(why)}</div>`:''}`;
  const b = $('#checkBtn'); b.disabled=false; b.textContent = 'Weiter'; b.focus({preventScroll:true});
  const replay = (ex.type==='pick' && ex.dir==='de2hr') || ['build','type','gap'].includes(ex.type) || (ex.type==='dialog' && !ex.d.understand) || !ok;
  if(replay) speak(hr);
}
function nextEx(){
  stopMic();
  L.i++; L.answered=false; L.sel=null; L.built=[];
  if(L.i >= L.queue.length){ finishLesson(); return; }
  renderLesson(); window.scrollTo(0,0);
}
function applyGrades(){
  Object.entries(L.res).forEach(([id,ok]) => grade(id, ok));
  L.seen.forEach(id => { if(!(id in L.res) && !P.items[id]) grade(id, true); });
  L.res = {}; L.seen = new Set();
}
function finishLesson(){
  applyGrades();
  if(L.mode==='day'){ const prev = P.done[L.day]; P.done[L.day] = {at:Date.now(), ok:L.ok, total:L.total, n:(prev?prev.n||1:0)+1}; const d=today(); P.log[d]=(P.log[d]||0)+1; }
  touch();
  R = {view:'done'};
  render(); window.scrollTo(0,0);
}
function quitLesson(){
  stopMic();
  if(L){ applyGrades(); touch(); }
  const back = L && L.mode==='day' ? 'heute' : 'ueben';
  L = null; try { speechSynthesis.cancel(); } catch(e){}
  go(back);
}
function renderDone(){
  const isDay = L.mode==='day', n = L.day;
  const ms = L.mistakes;
  const line = ex => {
    if(ex.item) return [ex.item.hr, ex.item.de, ex.item.note||''];
    if(ex.type==='gap') return [ex.g.s.replace('___', ex.g.o[0]), ex.g.de, ex.g.why||''];
    if(ex.type==='dialog') return ex.d.understand ? [ex.d.line, ex.d.o[0], ex.d.why||''] : [ex.d.o[0], ex.d.ctx, ex.d.why||''];
    return ['','',''];
  };
  const nx = isDay && n+1 < NDAYS ? n+1 : null;
  const nci = nx!==null ? Math.floor(nx/5) : null;
  const st = streak();
  return `<main><div class="wrap done"><section class="hero">
    <p class="eyebrow">${isDay ? `Tag ${n+1} · Kapitel ${Math.floor(n/5)+1} · ${esc(CH[Math.floor(n/5)].t)}` : 'Üben'}</p>
    <h1>${isDay ? `Tag ${n+1} geschafft.` : 'Geschafft.'}</h1>
    <div class="score">
      ${L.total?`<div><div class="n">${L.ok} / ${L.total}</div><div class="l">beim ersten Versuch richtig</div></div>`:''}
      ${isDay?`<div><div class="n">${st}</div><div class="l">${st===1?'Tag':'Tage'} in Folge</div></div>`:''}
      ${L.spoke?`<div><div class="n">${L.spoke}</div><div class="l">Sätze nachgesprochen</div></div>`:''}
      <div><div class="n">${learned().length}</div><div class="l">Wörter und Sätze gelernt</div></div>
    </div></section>
    ${nx!==null ? `<div class="next"><small>Morgen · Tag ${nx+1} · ${DAYTYPE[nx%5].t}</small><b>${esc(CH[nci].t)}</b> – ${esc(DAYTYPE[nx%5].d)}</div>` : ''}
    ${isDay && n===NDAYS-1 ? `<div class="next"><b>Das war der letzte Tag.</b> Čestitamo – du hast den ganzen Kurs geschafft!</div>` : ''}
    <div class="row">
      <button class="btn primary" data-go="heute">Fertig für heute</button>
      ${nx!==null?`<button class="btn" data-day="${nx}">Gleich weiter mit Tag ${nx+1}</button>`:''}
      ${!isDay?`<button class="btn" data-go="ueben">Weiter üben</button>`:''}
    </div>
    ${isDay?`<p class="hint" style="margin-top:14px">Tipp: Ein Tag pro Tag reicht. Die neuen Wörter von heute kommen morgen automatisch in der Wiederholung.</p>`:''}
    ${ms.length?`<div class="sec-h"><h2>Das solltest du dir merken</h2></div><ul class="plist">${ms.map(e=>{ const l=line(e); return phraseRow(l[0],l[1],l[2]); }).join('')}</ul>`:''}
  </div></main>`;
}

/* ------------------------------------------------------------------ */
/*  EVENTS                                                              */
/* ------------------------------------------------------------------ */
document.addEventListener('click', e => {
  const t = e.target;
  const say = t.closest('[data-say]'); if(say){ speak(say.dataset.say, say.dataset.slow==='1'); return; }
  const g = t.closest('[data-go]'); if(g){ if(R.view==='lesson') stopMic(); go(g.dataset.go); return; }
  const chb = t.closest('[data-ch]'); if(chb){ go('chapter',{ci:+chb.dataset.ch}); return; }
  const day = t.closest('[data-day]'); if(day && !day.disabled){ const n=+day.dataset.day; if(unlocked(n)) startLesson('day', buildDay(n), n); return; }
  const pr = t.closest('[data-practice]'); if(pr && !pr.disabled){ startLesson('review', buildPractice(pr.dataset.practice), null); return; }
  const rate = t.closest('[data-rate]'); if(rate){ P.rate = rate.dataset.rate; touch(); render(); speak('Dobar dan, kako ste?'); return; }
  const au = t.closest('[data-auto]'); if(au){ P.auto = au.dataset.auto==='1'; touch(); render(); return; }
  const le = t.closest('[data-lese]'); if(le){ P.lese = le.dataset.lese==='1'; touch(); render(); return; }
  if(t.closest('#reset')){ if(R.confirmReset){ P = blank(); touch(); R.confirmReset=false; } else R.confirmReset = true; render(); return; }
  if(t.closest('#resetNo')){ R.confirmReset=false; render(); return; }

  if(R.view!=='lesson' || !L) return;
  if(t.closest('#quit')){ quitLesson(); return; }
  if(t.closest('#reveal')){ const x=$('#ltext'); if(x) x.hidden=false; t.closest('#reveal').remove(); return; }
  if(t.closest('#mic')){ startMic(); return; }
  const ml = t.closest('[data-ml]'); if(ml){ matchClick('l', +ml.dataset.ml); return; }
  const mr = t.closest('[data-mr]'); if(mr){ matchClick('r', +mr.dataset.mr); return; }
  const o = t.closest('[data-opt]'); if(o){ select(+o.dataset.opt); return; }
  const tile = t.closest('[data-tile]'); if(tile && !L.answered){ const i=+tile.dataset.tile; if(!L.built.includes(i)){ L.built.push(i); if(cur().type==='build') speak(cur().tiles[i].t); renderTiles(); } return; }
  const out = t.closest('[data-tile-out]'); if(out && !L.answered){ const i=+out.dataset.tileOut; L.built = L.built.filter(x=>x!==i); renderTiles(); return; }
  const dia = t.closest('[data-dia]'); if(dia){ const inp=$('#typed'); const s=inp.selectionStart??inp.value.length, en=inp.selectionEnd??inp.value.length; inp.value = inp.value.slice(0,s)+dia.dataset.dia+inp.value.slice(en); inp.focus(); inp.setSelectionRange(s+1,s+1); setCan(true); return; }
  if(t.closest('#checkBtn')){ if(L.answered) nextEx(); else check(); return; }
});
document.addEventListener('keydown', e => {
  if(R.view!=='lesson' || !L || e.altKey || e.ctrlKey || e.metaKey) return;
  const inInput = e.target && e.target.tagName==='INPUT';
  if(e.key==='Enter'){
    const b=$('#checkBtn');
    if(b && !b.disabled){ e.preventDefault(); if(L.answered) nextEx(); else check(); }
    return;
  }
  if(!inInput && /^[1-4]$/.test(e.key)) select(+e.key-1);
  if(!inInput && e.key==='Backspace' && ['build','buildDe'].includes(cur().type) && !L.answered && L.built.length){ L.built.pop(); renderTiles(); }
});

/* boot */
const h0 = (location.hash||'').slice(1);
if(TABS.some(t=>t[0]===h0)) R = {view:h0};
render();
initSync();

</script>
<script>
/* Offline-Betrieb: Service Worker registrieren */
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
